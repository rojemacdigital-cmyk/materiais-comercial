<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vitrine do e-mail · Grupo Rojemac</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
  /* (05/10) "deve pesquisar com base no conteúdo dentro do e-mail" (Miriã). A barra de busca do e-mail
     (e os atalhos "Mais procurados") trazem o lojista para cá: só os produtos DAQUELE e-mail, filtrados
     pelo que ele digitou. Os dados vêm do Apps Script (?formato=json&vitrine=<peça>&v=<versão>). */
  :root{
    --bg:#F4F1EC; --surface:#FFFFFF; --ink:#16243D; --muted:#5F6B80; --line:#E3DDD3;
    --navy:#16243D; --cta:#EA663D; --gold:#EFC797; --chip:#E9EEF5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0E1626; --surface:#17223A; --ink:#E8E6E1; --muted:#9AA4B4; --line:#26324B; --chip:#1F2B44; }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .in{max-width:1100px;margin:0 auto;padding-left:24px;padding-right:24px;}
  .topo{background:var(--navy);color:#fff;}
  .topo .in{padding-top:24px;padding-bottom:22px;}
  .marca{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:clamp(22px,4vw,32px);line-height:1.15;margin:8px 0 6px;text-wrap:balance;}
  .sub{font-size:14px;color:#C9D1DE;}
  form.busca{display:flex;max-width:560px;margin-top:16px;border-radius:10px;overflow:hidden;background:#fff;}
  form.busca input{flex:1;min-width:0;border:0;outline:none;font:15px Roboto,Arial,sans-serif;color:#16243D;padding:0 14px;height:48px;background:#fff;}
  form.busca button{border:0;background:var(--cta);color:#fff;font:700 15px Montserrat,Arial,sans-serif;padding:0 20px;cursor:pointer;}
  form.busca:focus-within{box-shadow:0 0 0 3px rgba(234,102,61,.45);}
  .filtros{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);}
  .filtros .in{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;}
  .filtros button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:600 13px Roboto,Arial,sans-serif;padding:8px 14px;cursor:pointer;}
  .filtros button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
  main{padding-top:18px;padding-bottom:60px;}
  .conta{font-size:13.5px;color:var(--muted);margin:0 0 14px;}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .card{background:var(--surface);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(22,36,61,.06),0 10px 24px -20px rgba(22,36,61,.5);color:inherit;text-decoration:none;}
  .card .img{display:flex;align-items:center;justify-content:center;background:var(--chip);}
  .card img{display:block;width:100%;height:auto;}
  .card .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card .vit{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cta);}
  .card .nome{font-size:14px;font-weight:600;line-height:1.35;}
  .card .ir{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700;color:var(--cta);}
  a.card:hover{outline:2px solid var(--cta);}
  a.card:focus-visible,.btn:focus-visible,.filtros button:focus-visible{outline:2px solid var(--cta);outline-offset:2px;}
  mark{background:#FDE7B0;color:inherit;border-radius:3px;padding:0 1px;}
  .vazio{margin:40px auto;max-width:520px;text-align:center;font-size:15px;color:var(--muted);line-height:1.55;}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;font:700 14px Roboto,Arial,sans-serif;padding:12px 18px;text-decoration:none;background:var(--cta);color:#fff;}
  .btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .rodape{margin-top:32px;text-align:center;}
  @media (max-width:560px){.in{padding-left:16px;padding-right:16px;}.grade{grid-template-columns:repeat(2,1fr);gap:10px;}.card .info{padding:10px;}.card .nome{font-size:13px;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var EXEC='https://script.google.com/macros/s/AKfycbxIWNIKSBMdwA9diHYOxbw7GvPLJCGOjV2v3iR_ZyKFB8ONk0TdwKrUIovy1XdRTeTqgw/exec';
  var SITE='https://www.gruporojemac.com.br/search';
  var app=document.getElementById('app'), qs=new URLSearchParams(location.search);
  /* o Outlook.com põe "x_" na frente do nome dos campos do formulário: aceita os dois */
  function par(n){ return qs.get(n)||qs.get('x_'+n)||''; }
  var E=par('e').replace(/[^a-z0-9-]/gi,''), VV=par('v').replace(/[^a-z0-9-]/gi,''), Q=par('q');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  /* "taças" acha "taça", "faqueiros" acha "faqueiro" */
  function raiz(t){ t=norm(t); if(t.length>4&&/oes$/.test(t)){ return t.slice(0,-3); } if(t.length>3&&/s$/.test(t)){ return t.slice(0,-1); } return t; }
  app.innerHTML='<div class="topo"><div class="in"><div class="marca">Grupo Rojemac · Vitrine do e-mail</div><h1>Carregando os produtos…</h1></div></div>';
  function pede(n){
    fetch(EXEC+'?formato=json&vitrine='+encodeURIComponent(E||'-')+'&v='+encodeURIComponent(VV))
      .then(function(r){ return r.json(); }).then(iniciar)
      .catch(function(){ if(n<3){ setTimeout(function(){ pede(n+1); },1500*n); return; } iniciar({erro:'Não consegui carregar os produtos agora. Atualize a página em alguns segundos.'}); });
  }
  pede(1);

  function iniciar(D){
    D=D||{};
    var cards=D.cards||[], filtro='', utm='utm_source=sfmc&utm_medium=email&utm_campaign='+encodeURIComponent(slug(D.campanha||D.titulo||'email'))+'&utm_content=vitrine-busca';
    if(D.titulo){ document.title=D.titulo+' · Grupo Rojemac'; }
    /* (06/10) o lojista não vê o código interno: "5170-Taça…" vira "Taça…" */
    cards.forEach(function(c){ c.nome=String(c.nome||'').replace(/^\s*\d{3,7}\s*[-–_]\s*/,''); c.chave=norm(c.nome+' '+(c.vitrine||'')); });
    var vits=[]; cards.forEach(function(c){ if(c.vitrine&&vits.indexOf(c.vitrine)<0){ vits.push(c.vitrine); } });
    function comUtm(u){ if(!u){ return ''; } if(/[?&]utm_/.test(u)){ return u; } return u+(u.indexOf('?')<0?'?':'&')+utm; }
    function urlSite(q){ return SITE+'?type=product&q='+encodeURIComponent(q||'')+'&'+utm; }
    app.innerHTML='<div class="topo"><div class="in"><div class="marca">Grupo Rojemac · Vitrine do e-mail</div>'+
      '<h1>'+esc(D.erro?'Vitrine indisponível':(D.campanha||D.titulo||'Produtos do e-mail'))+'</h1>'+
      '<div class="sub">'+esc(D.erro||'Os produtos que estão neste e-mail. Busque pelo nome ou toque em uma vitrine.')+'</div>'+
      '<form class="busca" id="f" role="search"><input type="search" id="q" placeholder="O que a sua loja procura hoje?" aria-label="Buscar nos produtos do e-mail" value="'+esc(Q)+'"><button type="submit">Buscar</button></form></div></div>'+
      (vits.length>1?'<div class="filtros"><div class="in" id="vits"><button type="button" data-v="" aria-pressed="true">Todos</button>'+
        vits.map(function(v){ return '<button type="button" data-v="'+esc(v)+'" aria-pressed="false">'+esc(v)+'</button>'; }).join('')+'</div></div>':'')+
      '<main class="in"><p class="conta" id="conta"></p><div class="grade" id="grade"></div><div id="nada"></div>'+
      '<div class="rodape"><a class="btn sec" id="site" href="'+esc(urlSite(Q))+'">Não achou? Buscar no site todo →</a></div></main>';
    var inp=document.getElementById('q');
    function marca(txt,termos){
      var h=esc(txt);
      termos.forEach(function(t){ if(t.length<2){ return; }
        /* tira o acento letra a letra, para a posição do trecho continuar a mesma no texto original */
        var n=h.split('').map(function(ch){ return norm(ch).charAt(0)||ch; }).join(''), i=n.indexOf(t); if(i<0){ return; }
        h=h.slice(0,i)+'<mark>'+h.slice(i,i+t.length)+'</mark>'+h.slice(i+t.length); });
      return h;
    }
    function pinta(){
      var q=inp.value.trim(), termos=q?q.split(/\s+/).map(raiz).filter(Boolean):[];
      var achados=cards.filter(function(c){ return (!filtro||c.vitrine===filtro)&&termos.every(function(t){ return c.chave.indexOf(t)>=0; }); });
      document.getElementById('grade').innerHTML=achados.map(function(c){
        var u=comUtm(c.link), tag=u?'a':'div';
        return '<'+tag+' class="card"'+(u?' href="'+esc(u)+'"':'')+'><div class="img"><img src="'+esc(c.img)+'" alt="'+esc(c.nome)+'" loading="lazy"></div>'+
          '<div class="info">'+(c.vitrine?'<span class="vit">'+esc(c.vitrine)+'</span>':'')+'<span class="nome">'+marca(c.nome,termos)+'</span>'+(u?'<span class="ir">Ver produto →</span>':'')+'</div></'+tag+'>';
      }).join('');
      document.getElementById('conta').textContent=D.erro?'':(q?(achados.length+' produto'+(achados.length===1?'':'s')+' deste e-mail com “'+q+'”'):(achados.length+' produto'+(achados.length===1?'':'s')+' neste e-mail'));
      document.getElementById('nada').innerHTML=(!D.erro&&!achados.length)?'<div class="vazio">Nenhum produto deste e-mail com “'+esc(q)+'”.<br><br><a class="btn" href="'+esc(urlSite(q))+'">Buscar “'+esc(q)+'” no site todo →</a></div>':'';
      document.getElementById('site').href=urlSite(q);
      document.getElementById('site').parentNode.style.display=(!D.erro&&!achados.length)?'none':'';
      try{ var u2=new URL(location.href); u2.search=''; u2.searchParams.set('e',E); if(VV){ u2.searchParams.set('v',VV); } if(q){ u2.searchParams.set('q',q); } history.replaceState(null,'',u2.toString()); }catch(e){}
    }
    document.getElementById('f').addEventListener('submit',function(e){ e.preventDefault(); pinta(); inp.blur(); });
    inp.addEventListener('input',pinta);
    var vb=document.getElementById('vits');
    if(vb){ vb.addEventListener('click',function(e){ var b=e.target.closest('[data-v]'); if(!b){ return; } filtro=b.dataset.v;
      vb.querySelectorAll('[data-v]').forEach(function(x){ x.setAttribute('aria-pressed',String(x===b)); }); pinta(); }); }
    pinta();
    /* chegou pela barra-link, sem termo: o cursor já vai para a busca (depois de os produtos carregarem) */
    if(!D.erro&&!inp.value){ try{ inp.focus(); }catch(e){} }
  }
})();
</script>
</body>
</html>
